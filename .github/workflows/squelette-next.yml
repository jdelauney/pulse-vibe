# Squelette du pack pulse-vibe-next : chaque semaine, il passe toutes ses dépendances à leur
# dernière version, puis s'installe, se contrôle, se teste et se construit (bout en bout compris).
# Si tout passe et que des versions ont changé, une demande de fusion propose la mise à jour.
name: Squelette Next.js (dernières versions)

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  squelette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
      - name: Vérifier le squelette avec les dernières versions
        run: node plugins/pulse-vibe-next/scripts/verifier-squelette.js --dernieres --ecrire --e2e
        env:
          CI: "true"
      - name: Proposer la mise à jour
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: chore/squelette-next-dernieres-versions
          commit-message: "chore(next): squelette aux dernières versions"
          title: "chore(next): squelette aux dernières versions"
          body: |
            Mise à jour automatique des dépendances du squelette de pulse-vibe-next.
            Le squelette s'installe, passe Biome, TypeScript, Vitest, la construction et les tests de bout en bout avec ces versions.
            Avant de fusionner : monter la version de plugins/pulse-vibe-next/.claude-plugin/plugin.json (correctif).
          add-paths: plugins/pulse-vibe-next/templates/squelette
