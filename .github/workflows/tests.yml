# Tests des plugins (cœur et packs), à chaque envoi et sur chaque demande de fusion.
name: Tests des plugins

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
      - name: Tests
        shell: bash
        run: node --test plugins/*/tests/*.test.js
