# Publication du wiki (wiki/) sur GitHub Pages, à chaque envoi sur main qui le touche.
# Une fois dans les réglages du dépôt : Pages → Source « GitHub Actions ». L'accueil est wiki/index.html.
name: Wiki

on:
  push:
    branches: [main]
    paths: ["wiki/**", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
      - name: Wiki à jour avec les commandes
        run: node wiki/outils/synchroniser.js --verifier
      # Le site publié : le wiki sans ses outils ni sa charte.
      - name: Préparer le site
        run: |
          mkdir _site
          cp -r wiki/. _site/
          rm -rf _site/outils _site/CHARTE.md _site/commandes/_modele.html
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v5.0.1
